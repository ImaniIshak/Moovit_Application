
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Moovit UI/UX Application</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="app-body flex flex-col items-center justify-center min-h-screen p-0 sm:p-4">

    <!-- Desktop Title -->
    <div class="hidden sm:block text-center max-w-lg mb-4">
        <h1 class="desktop-title text-xl font-bold mb-1">
            MyRapid KL UI/UX Application
        </h1>
        <p class="desktop-subtitle text-xs"></p>
    </div>

    <!-- Main Phone Frame -->
    <div class="phone-frame w-full h-screen sm:h-[840px] flex flex-col relative overflow-hidden">

        <!-- Phone Status Bar -->
        <div class="status-bar w-full px-6 py-2 flex justify-between items-center text-xs flex-shrink-0">
            <span>9:41 AM</span>

            <div class="speaker-notch w-20 h-4 rounded-full mx-auto hidden sm:block"></div>

            <div class="flex gap-2 items-center">
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full"></i>
            </div>
        </div>

        
        <!-- MyRapid KL App Header -->
        <div class="rapid-header px-4 py-3 flex items-center justify-between shadow-sm z-40 flex-shrink-0">

            <div class="flex items-center gap-2.5">
                <i class="fa-solid fa-bars text-lg cursor-pointer"></i>

                <div class="font-bold text-base tracking-wide flex items-center gap-2">
                    <span class="rapid-logo px-1.5 py-0.5 rounded font-extrabold text-xs">
                        PULSE
                    </span>

                    <span>MyRapid KL</span>
                </div>
            </div>

            <span class="rapid-location text-[10px] px-2.5 py-1 rounded-full font-semibold border">
                Klang Valley
            </span>

        </div>


        <!-- Scrollable Content -->
        <div class="content-area flex-1 overflow-y-auto hide-scrollbar relative p-4 flex flex-col gap-4">

            
            <div class="content-area search-page">

                <div class="search-heading">
                    <h2>Where do you want to go?</h2>
                    <p>Find your destination.</p>
                </div>

                <div class="search-box">

                    <div class="search-field">
                        <i class="fa-solid fa-location-dot"></i>
                        <input type="text" placeholder="Starting location">
                    </div>

                    <hr>

                    <div class="search-field">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" placeholder="Your destination">
                    </div>

                </div>

                <button class="search-button">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    Find a trip
                </button>

                <div class="popular-destinations">
                    <h3>Popular Destination</h3>

                    <div class="destination-list">
                        <button type="button">KLCC</button>
                        <button type="button">TRX</button>
                        <button type="button">KL Sentral</button>
                    </div>
                </div>

            </div>

            
            <!-- Add your app content here -->

        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav border-t px-6 py-2.5 flex justify-around items-center text-xs flex-shrink-0 z-40">

            <div class="nav-item nav-active flex flex-col items-center font-bold cursor-pointer">
                <i class="fa-solid fa-location-arrow text-sm mb-0.5"></i>
                <span class="text-[10px]">Directions</span>
            </div>

            <div class="nav-item flex flex-col items-center cursor-pointer">
                <i class="fa-solid fa-clock-rotate-left text-sm mb-0.5"></i>
                <span class="text-[10px]">Schedules</span>
            </div>

            <div class="nav-item flex flex-col items-center cursor-pointer">
                <i class="fa-solid fa-triangle-exclamation text-sm mb-0.5"></i>
                <span class="text-[10px]">Alerts</span>
            </div>

        </div>

        

    </div>

    <!-- Custom JavaScript -->
    <script src="script.js"></script>
</body>
</html>
